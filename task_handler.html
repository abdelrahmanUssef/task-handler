<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Work Tasks</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1b1f27;--mu:#6b7280;--bd:#e3e6ec;--ac:#2f6fed;--acb:#e8f0ff;--ok:#16a34a;--okb:#e7f7ed;--na:#d97706;--nab:#fdf1de;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1218;--card:#181c25;--tx:#e8eaf0;--mu:#8b93a3;--bd:#272c38;--ac:#6b9bff;--acb:#1c2a48;--ok:#4ade80;--okb:#12301f;--na:#fbbf24;--nab:#3a2c0f;color-scheme:dark}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;border-bottom:1px solid var(--bd);padding:14px 20px}
.wrap{max-width:1300px;margin:0 auto}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
h1{font-size:20px;margin:0}.date{color:var(--mu);font-size:13px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:4px 10px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--bd);background:var(--card)}
.chip.ok{color:var(--ok);background:var(--okb);border-color:transparent}.chip.na{color:var(--na);background:var(--nab);border-color:transparent}.chip.tl{color:var(--ac);background:var(--acb);border-color:transparent}
.bar{height:8px;background:var(--bd);border-radius:99px;margin:12px 0 10px;overflow:hidden;display:flex}
.bar i{display:block;height:100%;transition:width .3s}.b1{background:var(--ok)}.b2{background:var(--na)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tools input[type=search]{flex:1;min-width:160px}
input,button,select{font:inherit;color:var(--tx)}
input[type=search],select{padding:7px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card)}
button{padding:7px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card);cursor:pointer}
button:hover{border-color:var(--ac)}button.on{background:var(--ac);border-color:var(--ac);color:#fff}
main{max-width:1300px;margin:0 auto;padding:18px 20px 40px;columns:3 340px;column-gap:16px}
.cat{break-inside:avoid;background:var(--card);border:1px solid var(--bd);border-radius:12px;margin:0 0 16px;overflow:hidden}
.cat h2{margin:0;padding:12px 14px;font-size:14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--bd)}
.cat h2 span{color:var(--mu);font-weight:500;font-size:12px}
.t{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--bd)}
.t:last-child{border-bottom:0}
.ck{width:22px;height:22px;border-radius:6px;border:2px solid var(--bd);flex:none;cursor:pointer;display:grid;place-items:center;font-size:14px;color:#fff}
.t.done .ck{background:var(--ok);border-color:var(--ok)}
.t.na .ck{background:var(--na);border-color:var(--na)}
.tt{flex:1;min-width:0;word-break:break-word}
.t.done .tt{text-decoration:line-through;color:var(--mu)}
.t.na .tt{color:var(--mu);font-style:italic}
.t select{font-size:12px;padding:4px 6px;max-width:92px}
.t select.has{background:var(--acb);color:var(--ac);border-color:transparent;font-weight:600}
.nb{font-size:11px;padding:3px 8px;color:var(--mu)}.t.na .nb{background:var(--nab);color:var(--na);border-color:transparent}
.t.hide{display:none}
.tm{display:block;font-size:11px;color:var(--mu);margin-top:2px}.tm.slow{color:#dc2626;font-weight:600}.t.slow{box-shadow:inset 3px 0 #dc2626}
#rep{display:none;max-width:1300px;margin:16px auto 0;padding:0 20px}#rep.open{display:block}
#rep .box{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px}
#rep .sc{overflow-x:auto}h3{margin:0 0 8px;font-size:14px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-weight:600}
.empty{color:var(--mu);text-align:center;padding:40px;column-span:all}
</style></head><body>
<header><div class="wrap">
 <div class="top"><div><h1>Daily Work Tasks</h1><div class="date" id="date"></div></div>
 <div class="stats"><span class="chip ok" id="sDone"></span><span class="chip na" id="sNa"></span><span class="chip" id="sPend"></span></div></div>
 <div class="bar"><i class="b1" id="b1"></i><i class="b2" id="b2"></i></div>
 <div class="stats" id="tellers" style="margin-bottom:10px"></div>
 <div class="tools">
  <input type="search" id="q" placeholder="Search tasks…">
  <select id="tf"><option value="all">All tellers</option><option value="0">Unassigned</option><option value="1">Teller 1</option><option value="2">Teller 2</option><option value="3">Teller 3</option><option value="4">Teller 4</option></select>
  <button data-f="all" class="on">All</button><button data-f="pending">Pending</button><button data-f="done">Done</button><button data-f="na">Not available</button>
  <select id="lim" title="Flag tasks slower than"><option value="15">Slow after 15 min</option><option value="30">Slow after 30 min</option><option value="45">Slow after 45 min</option><option value="60">Slow after 60 min</option><option value="90">Slow after 90 min</option><option value="120">Slow after 2 hours</option></select>
  <button id="rb">Time report</button><button id="reset">Reset today</button>
 </div></div></header>
<section id="rep"></section>
<main id="main"></main>
<script>
const SEED={
"Morning Tasks":["Vault Proofs","Morning Midas (Returned Chqs)","Reversal And Historical"],
"Teller's Batch Cross Checking":["Teller 1","Teller 2","Teller 3","Teller 4"],
"Navigator Reports":["CBE Withdrawals","Transactions implemented over KYC Accounts","Account Opening and Closing","COD","CHQ Book - BPM","Data Quality KYC","NTB Data Quality","Casual Past Due","Referal By Account","Referal By Customer Number","Nil Report"],
"T24 Reports":["Inactive Rest","General Ledgers","Daily Issued","Cheques Stop Payment","E-Finance","Reversal Reports","Back Office","vault Register","Cash Balance"],
"physical Tasks":["Tazbeet And Ta2weet","SR + Termination","Cash Counted and Initialed","Internals Cross Checking","Swifts Cross checking","CPC & PDC Excell + Mail","CPC cross Checking","Mail Bag & Microfilm","Filing"],
"Printing Logs":["Midas EOD","Batch Log","SR Log","Pending Log","Swifts Log","Recived CPC Mail"],
"End Of day":["Daily OR","GDWF","Settle POS","Settle Shipment","Send Unauthorized Mail","Authorize All Pending Over T24","Authorize All Pending Over BPM","Gard Cash","Check Registers"],


};
const tasks=[];let n=1;for(const c in SEED)SEED[c].forEach(t=>tasks.push({id:n++,c,t}));
const pad=x=>String(x).padStart(2,"0");
const today=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let db=null,unsub=null,day=today(),S={},mode="connecting",filter="all",tfil="all",query="",queue={},H=[],limit=30,repOpen=false;
const LK=()=>"dwt_local_"+day;
function loadLocal(){try{S=JSON.parse(localStorage.getItem(LK())||"{}")}catch(e){S={}}}
function saveLocal(){try{localStorage.setItem(LK(),JSON.stringify(S))}catch(e){}}
function sub(){
 if(unsub){try{unsub()}catch(e){}unsub=null}
 S={};
 unsub=db.collection("days/"+day+"/tasks").onSnapshot(snap=>{const m={};snap.docs.forEach(d=>{if(d.exists)m[d.id]=d.data()});S=m;mode="live";render()},()=>{mode="error";render()});
}
async function init(){
 render();
 try{db=await Promise.race([claude.use("db"),new Promise(r=>setTimeout(()=>r(null),10000))])}catch(e){db=null}
 if(db){sub();subMeta()}else{mode="local";loadLocal();try{limit=+localStorage.getItem("dwt_limit")||30}catch(e){}render()}
}
function subMeta(){
 db.doc("settings/main").onSnapshot(s=>{if(s.exists&&s.data().limit){limit=+s.data().limit;render()}},()=>{});
 db.collection("history").onSnapshot(s=>{H=s.docs.filter(d=>d.exists).map(d=>d.data());if(repOpen)render()},()=>{});
}
function checkDay(){if(day!==today()){day=today();if(db)sub();else{loadLocal();render()}}}
function put(id,patch){
 const cur=S[id]||{a:0,s:"",at:0,dt:0},nx=Object.assign({a:0,s:"",at:0,dt:0},cur,patch),now=Date.now();
 if(patch.a!==undefined&&patch.a!==cur.a){nx.at=patch.a?now:0;nx.dt=0;if(nx.s==="done")nx.s=""}
 if(patch.s!==undefined)nx.dt=patch.s==="done"?now:0;
 if(!nx.a&&!nx.s)delete S[id];else S[id]=nx;
 render();
 if(!db){saveLocal();return}
 const ref=db.collection("days/"+day+"/tasks").doc(String(id));
 queue[id]=(queue[id]||Promise.resolve()).then(async()=>{await((nx.a||nx.s)?ref.set(nx):ref.delete());
  const hr=db.collection("history").doc(day+"-"+id);
  if(nx.s==="done"&&nx.at)await hr.set({id:+id,tl:nx.a,day,dur:nx.dt-nx.at,t:nx.dt});else if(cur.s==="done"&&nx.s!=="done")await hr.delete()}).catch(()=>{mode="error";render()});
}
const A=id=>(S[id]&&S[id].a)||0,V=id=>(S[id]&&S[id].s)||"";
const fmt=ms=>{const m=Math.floor(ms/60000);return m<1?"<1 min":m<60?m+" min":Math.floor(m/60)+"h "+pad(m%60)+"m"};
const hhmm=ms=>new Date(ms).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
const el=id=>{const x=S[id];if(!x||!x.at||x.s==="na")return 0;return (x.dt||Date.now())-x.at};
const isSlow=id=>el(id)>limit*60000;
function tmHtml(id){const x=S[id];if(!x||!x.at||x.s==="na")return"";const d=x.s==="done";
 return `<span class="tm ${isSlow(id)?"slow":""}">Assigned ${hhmm(x.at)} · ${d?"finished "+hhmm(x.dt)+" · took ":"in progress "}${fmt(el(id))}${isSlow(id)?" ⚠ slow":""}</span>`}
function report(){
 lim.value=String(limit);rep.className=repOpen?"open":"";if(!repOpen)return;
 const rows=tasks.filter(t=>S[t.id]&&S[t.id].at&&V(t.id)!=="na").map(t=>({t,x:S[t.id],d:el(t.id)})).sort((a,b)=>b.d-a.d);
 const g={};H.forEach(r=>{(g[r.id]=g[r.id]||[]).push(r)});
 const avg=Object.keys(g).map(k=>{const l=g[k];return{t:tasks.find(t=>t.id==k),n:l.length,a:l.reduce((s,r)=>s+r.dur,0)/l.length,m:Math.max(...l.map(r=>r.dur))}}).filter(r=>r.t).sort((a,b)=>b.a-a.a).slice(0,15);
 const red=v=>v>limit*60000?' style="color:#dc2626;font-weight:600"':"";
 rep.innerHTML=`<div class="box"><div class="sc"><h3>Today (slowest first)</h3><table><tr><th>Task</th><th>Teller</th><th>Assigned</th><th>Finished</th><th>Time</th></tr>${rows.map(r=>`<tr><td>${esc(r.t.t)}</td><td>Teller ${r.x.a}</td><td>${hhmm(r.x.at)}</td><td>${r.x.dt?hhmm(r.x.dt):"in progress"}</td><td${red(r.d)}>${fmt(r.d)}</td></tr>`).join("")||'<tr><td colspan="5">Nothing assigned yet today.</td></tr>'}</table></div>
 <div class="sc"><h3>Slowest tasks across all days (average)</h3><table><tr><th>Task</th><th>Times done</th><th>Average</th><th>Longest</th></tr>${avg.map(r=>`<tr><td>${esc(r.t.t)}</td><td>${r.n}</td><td${red(r.a)}>${fmt(r.a)}</td><td>${fmt(r.m)}</td></tr>`).join("")||'<tr><td colspan="4">No finished tasks recorded yet.</td></tr>'}</table></div></div>`;
}
function stats(){
 let d=0,na=0;tasks.forEach(t=>{const v=V(t.id);if(v==="done")d++;else if(v==="na")na++});
 const T=tasks.length;
 date.textContent=new Date().toLocaleDateString(undefined,{weekday:"long",year:"numeric",month:"long",day:"numeric"})+" · resets daily · "+(mode==="live"?"shared live":mode==="local"?"saved on this device only":mode==="error"?"connection problem":"connecting…");
 sDone.textContent="Done "+d;sNa.textContent="N/A "+na;sPend.textContent="Pending "+(T-d-na)+" / "+T;
 b1.style.width=d/T*100+"%";b2.style.width=na/T*100+"%";
 let h="";for(let k=1;k<=4;k++){const mine=tasks.filter(t=>A(t.id)===k&&V(t.id)!=="na"),dn=mine.filter(t=>V(t.id)==="done").length;h+=`<span class="chip tl">Teller ${k}: ${dn}/${mine.length} done</span>`}
 const un=tasks.filter(t=>!A(t.id)&&!V(t.id)).length;h+=`<span class="chip">Unassigned: ${un}</span>`;const sl=tasks.filter(t=>isSlow(t.id)).length;h+=`<span class="chip" style="color:#dc2626">Slow: ${sl}</span>`;tellers.innerHTML=h;
}
function render(){
 const cats=[...new Set(tasks.map(t=>t.c))];let h="",shown=0;
 cats.forEach(c=>{const list=tasks.filter(t=>t.c===c),na=list.filter(t=>V(t.id)==="na").length,dn=list.filter(t=>V(t.id)==="done").length;
  h+=`<section class="cat"><h2>${esc(c)}<span>${dn}/${list.length-na} done${na?" · "+na+" N/A":""}</span></h2>`;
  list.forEach(t=>{const v=V(t.id),a=A(t.id);
   const ok=(filter==="all"||(filter==="pending"?!v:v===filter))&&(tfil==="all"||a===+tfil)&&(!query||t.t.toLowerCase().includes(query));
   if(ok)shown++;
   h+=`<div class="t ${v} ${ok?"":"hide"} ${isSlow(t.id)?"slow":""}" data-id="${t.id}"><div class="ck" data-a="done" title="Mark done">${v==="done"?"✓":v==="na"?"–":""}</div>
   <div class="tt">${esc(t.t)}${tmHtml(t.id)}</div>
   <select data-a="assign" class="${a?"has":""}" ${v==="na"?"disabled":""}><option value="0">Assign…</option>${[1,2,3,4].map(k=>`<option value="${k}" ${a===k?"selected":""}>Teller ${k}</option>`).join("")}</select>
   <button class="nb" data-a="na">${v==="na"?"Undo N/A":"N/A"}</button></div>`});
  h+="</section>"});
 if(!shown)h+='<div class="empty">No tasks match this filter.</div>';
 main.innerHTML=h;stats();report();
}
main.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b||b.tagName==="SELECT")return;checkDay();
 const id=+b.closest(".t").dataset.id,a=b.dataset.a;
 if(a==="done")put(id,{s:V(id)==="done"?"":"done"});
 else if(a==="na")put(id,{s:V(id)==="na"?"":"na"});
});
main.addEventListener("change",e=>{if(e.target.dataset.a==="assign"){checkDay();put(+e.target.closest(".t").dataset.id,{a:+e.target.value})}});
document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{filter=b.dataset.f;document.querySelectorAll("[data-f]").forEach(x=>x.classList.toggle("on",x===b));render()});
q.oninput=()=>{query=q.value.toLowerCase();render()};
tf.onchange=()=>{tfil=tf.value;render()};
rb.onclick=()=>{repOpen=!repOpen;rb.classList.toggle("on",repOpen);render()};
lim.onchange=()=>{limit=+lim.value;if(db){db.doc("settings/main").set({limit}).catch(()=>{})}else{try{localStorage.setItem("dwt_limit",limit)}catch(e){}}render()};
reset.onclick=()=>{if(!confirm("Clear today’s assignments and progress for everyone?"))return;
 const ids=Object.keys(S);S={};render();
 if(!db){saveLocal();return}
 ids.forEach(id=>{queue[id]=(queue[id]||Promise.resolve()).then(()=>Promise.all([db.collection("days/"+day+"/tasks").doc(id).delete(),db.collection("history").doc(day+"-"+id).delete()])).catch(()=>{})})};
document.addEventListener("visibilitychange",()=>{if(!document.hidden)checkDay()});
setInterval(()=>{checkDay();if(document.activeElement.tagName!=="SELECT")render()},30000);
init();
</script></body></html>
