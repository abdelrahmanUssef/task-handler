<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Work Tasks</title>
<style>
:root{--bg:#eef1f6;--card:#fff;--tx:#0f172a;--mu:#64748b;--bd:#e2e8f0;--ac:#1d4ed8;--acb:#e6edff;--ok:#15803d;--okb:#e3f5e9;--na:#b45309;--nab:#fdf0dc;--rd:#dc2626;--rdb:#fdecec;--hd:#0f2a4a;--sh:0 1px 2px rgba(15,23,42,.05),0 4px 14px rgba(15,23,42,.05);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--card:#141b2e;--tx:#e6e9f2;--mu:#8e98ad;--bd:#242d45;--ac:#7aa2ff;--acb:#1b2a4f;--ok:#4ade80;--okb:#10301f;--na:#fbbf24;--nab:#3a2c0f;--rd:#f87171;--rdb:#3a1618;--hd:#101a33;color-scheme:dark}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1300px;margin:0 auto}
header{background:var(--hd);color:#fff;padding:20px 20px 16px}
.top{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:20px}
h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-.01em}.date{color:rgba(255,255,255,.7);font-size:12.5px;margin-top:1px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:5px 11px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--bd);background:var(--card)}
header .chip{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.16);color:#fff}
header .chip.ok{background:rgba(74,222,128,.18);color:#86efac}header .chip.na{background:rgba(251,191,36,.18);color:#fcd34d}header .chip.late{background:rgba(248,113,113,.22);color:#fecaca}
.bar{height:6px;background:rgba(255,255,255,.16);border-radius:99px;margin:16px 0 12px;overflow:hidden;display:flex}
.bar i{display:block;height:100%;transition:width .3s}.b1{background:#4ade80}.b2{background:#fbbf24}
.tb{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--bd);padding:10px 20px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tools input[type=search]{flex:1;min-width:160px}
input,button,select{font:inherit;color:var(--tx)}
input[type=search],select{padding:8px 11px;border:1px solid var(--bd);border-radius:8px;background:var(--card)}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
button{padding:8px 13px;border:1px solid var(--bd);border-radius:8px;background:var(--card);cursor:pointer;font-weight:500}
button:hover{border-color:var(--ac);color:var(--ac)}button.on{background:var(--ac);border-color:var(--ac);color:#fff}
button#reset{color:var(--rd)}button#reset:hover{border-color:var(--rd)}
main{max-width:1300px;margin:0 auto;padding:18px 20px 40px;columns:3 340px;column-gap:18px}
.cat{break-inside:avoid;background:var(--card);border:1px solid var(--bd);border-radius:12px;margin:0 0 18px;overflow:hidden;box-shadow:var(--sh)}
.cat h2{margin:0;padding:12px 16px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--bd);border-top:3px solid var(--ac)}
.cat h2 span{color:var(--ac);background:var(--acb);padding:2px 9px;border-radius:99px;font-weight:600;font-size:11px;letter-spacing:0;text-transform:none}
.t{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--bd);transition:background .15s}
.hr{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.cat h2 span.ct{background:var(--bg);color:var(--mu);border:1px solid var(--bd)}
.mt{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:5px}
.px{font-size:11px;font-weight:600;padding:1px 8px;border-radius:99px;color:var(--ac);background:var(--acb);border-color:transparent}
.tp{font-size:11px;color:var(--mu);background:var(--bg);border:1px solid var(--bd);border-radius:99px;padding:1px 8px;white-space:nowrap;font-weight:500}
.t:hover{background:var(--bg)}.t:last-child{border-bottom:0}
.ck{width:22px;height:22px;border-radius:50%;border:2px solid #cbd5e1;flex:none;cursor:pointer;display:grid;place-items:center;font-size:13px;color:#fff;transition:all .15s}
.ck:hover{border-color:var(--ok)}
.t.done .ck{background:var(--ok);border-color:var(--ok)}
.t.na .ck{background:var(--na);border-color:var(--na)}
.tt{flex:1;min-width:0;word-break:break-word}.nm{font-weight:500}
.t.done .nm{text-decoration:line-through;color:var(--mu);font-weight:400}
.t.na .nm{color:var(--mu);font-weight:400}
.t select{font-size:12px;padding:5px 7px;max-width:112px;border-radius:99px}
.t select.has{background:var(--acb);color:var(--ac);border-color:transparent;font-weight:600}
.nb{font-size:11px;font-weight:600;padding:1px 9px;color:var(--mu);border-radius:99px}.t.na .nb{background:var(--nab);color:var(--na);border-color:transparent}
.nb:disabled{cursor:default;opacity:.85}
.t.hide{display:none}
.tm{display:block;font-size:11.5px;color:var(--mu);margin-top:4px;font-weight:400}.tm.slow{color:var(--rd);font-weight:600}
.t.slow{background:var(--rdb);box-shadow:inset 3px 0 var(--rd)}
#rep{display:none;max-width:1300px;margin:18px auto 0;padding:0 20px}#rep.open{display:block}
#rep .box{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;box-shadow:var(--sh);display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:22px}
#rep .sc{overflow-x:auto}h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mu)}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-weight:600;font-size:11.5px;background:var(--bg)}
.empty{color:var(--mu);text-align:center;padding:40px;column-span:all}
@media (max-width:600px){header{padding:16px 14px 12px}.tb{padding:8px 14px}main{padding:14px 14px 32px}.t select{max-width:96px}}
</style></head><body>
<header><div class="wrap">
 <div class="top"><div class="brand"><div class="logo">📋</div><div><h1>Daily Work Tasks</h1><div class="date" id="date"></div></div></div>
 <div class="stats"><span class="chip ok" id="sDone"></span><span class="chip na" id="sNa"></span><span class="chip" id="sPend"></span><span class="chip" id="sLeft" title="Work left (TAT of unfinished tasks, minus time already spent)"></span><span class="chip" id="sF4" title="Finish time if the work is shared by 4"></span><span class="chip" id="sF1" title="Finish time if one person does everything"></span></div></div>
 <div class="bar"><i class="b1" id="b1"></i><i class="b2" id="b2"></i></div>
 <div class="stats" id="tellers"></div>
</div></header>
<div class="tb"><div class="wrap"><div class="tools">
  <input type="search" id="q" placeholder="Search tasks…">
  <select id="tf"><option value="all">Everyone</option><option value="0">Unassigned</option></select>
  <button data-f="all" class="on">All</button><button data-f="pending">Pending</button><button data-f="done">Done</button><button data-f="na">Not available</button>
  <button id="rb">Time report</button><button id="reset">Reset today</button>
 </div></div></div>
<section id="rep"></section>
<main id="main"></main>
<script>
const SEED={
"Morning Tasks":["Vault Proofs","Morning Midas (Returned Chqs)","Reversal And Historical"],
"Teller's Batch Cross Checking":["Nada","Abdelrahman","Mohamed","Sherouk"],
"Navigator Reports":["CBE Withdrawals","Transactions implemented over KYC Accounts","Account Opening and Closing","COD","CHQ Book - BPM","Data Quality KYC","NTB Data Quality","Casual Past Due","Referal By Account","Referal By Customer Number","Nil Report"],
"T24 Reports":["Inactive Reset","General Ledgers","Daily Issued","Cheques Stop Payment","E-Finance","Reversal Reports","Back Office","vault Register","Cash Balance"],
"physical Tasks":["Tazbeet And Ta2weet","SR + Termination","Cash Counted and Initialed","Internals Cross Checking","Swifts Cross checking","CPC & PDC Excell + Mail","CPC cross Checking","Mail Bag","Filing"],
"Printing Logs":["Midas EOD","Batch Log","SR Log","Pending Log","Swifts Log","Recived CPC Mail"],
"End Of day":["Daily OR","GDWF","Settle POS","Settle Shipment","Send Unauthorized Mail","Authorize All Pending Charges Over T24","Authorize All Pending Over BPM","Gard Cash","Check Registers"],


};
const TATS=[2,2,5,30,30,30,30,5,5,10,5,5,5,5,10,5,5,2,5,2,15,2,15,5,15,5,15,30,30,20,15,10,10,10,5,5,2,5,5,10,5,5,5,5,10,10,15,2,20,10,10];/* minutes allowed per task, in task order */
const tasks=[];let n=1;for(const c in SEED)SEED[c].forEach(t=>tasks.push({id:n++,c,t}));
TATS[51]=15;const DAYS={52:[0,3]};/* Microfilm: Sunday & Wednesday only */
tasks.splice(tasks.findIndex(t=>t.t==="Mail Bag")+1,0,{id:52,c:"physical Tasks",t:"Microfilm"});
const pad=x=>String(x).padStart(2,"0");
const today=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let db=null,unsub=null,day=today(),S={},mode="connecting",filter="all",tfil="all",query="",queue={},H=[],repOpen=false;const NAMES=["Nada","Abdelrahman","Mohamed","Sherouk"],nm=k=>NAMES[k-1]||"";
const LK=()=>"dwt_local_"+day;
function loadLocal(){try{S=JSON.parse(localStorage.getItem(LK())||"{}")}catch(e){S={}}}
function saveLocal(){try{localStorage.setItem(LK(),JSON.stringify(S))}catch(e){}}
function sub(){
 if(unsub){try{unsub()}catch(e){}unsub=null}
 S={};
 unsub=db.collection("days/"+day+"/tasks").onSnapshot(snap=>{const m={};snap.docs.forEach(d=>{if(d.exists)m[d.id]=d.data()});S=m;mode="live";render()},()=>{mode="error";render()});
}
async function init(){
 render();
 try{db=await Promise.race([claude.use("db"),new Promise(r=>setTimeout(()=>r(null),10000))])}catch(e){db=null}
 if(db){sub();subMeta()}else{mode="local";loadLocal();render()}
}
function subMeta(){
 db.collection("history").onSnapshot(s=>{H=s.docs.filter(d=>d.exists).map(d=>d.data());if(repOpen)render()},()=>{});
}
function checkDay(){if(day!==today()){day=today();if(db)sub();else{loadLocal();render()}}}
function put(id,patch){
 const cur=S[id]||{a:0,s:"",at:0,dt:0},nx=Object.assign({a:0,s:"",at:0,dt:0},cur,patch),now=Date.now();
 if(patch.a!==undefined&&patch.a!==cur.a){nx.at=patch.a?now:0;nx.dt=0;if(nx.s==="done")nx.s=""}
 if(patch.s!==undefined)nx.dt=patch.s==="done"?now:0;
 if(!nx.a&&!nx.s&&!nx.x)delete S[id];else S[id]=nx;
 render();
 if(!db){saveLocal();return}
 const ref=db.collection("days/"+day+"/tasks").doc(String(id));
 queue[id]=(queue[id]||Promise.resolve()).then(async()=>{await((nx.a||nx.s||nx.x)?ref.set(nx):ref.delete());
  const hr=db.collection("history").doc(day+"-"+id);
  if(nx.s==="done"&&nx.at)await hr.set({id:+id,tl:nx.a,day,dur:nx.dt-nx.at,t:nx.dt});else if(cur.s==="done"&&nx.s!=="done")await hr.delete()}).catch(()=>{mode="error";render()});
}
const dow=()=>new Date(day+"T12:00:00").getDay();
const lock=id=>!!DAYS[id]&&!DAYS[id].includes(dow());
const A=id=>(S[id]&&S[id].a)||0,V=id=>lock(id)?"na":(S[id]&&S[id].s)||"";
const fmt=ms=>{const m=Math.floor(ms/60000);return m<1?"<1 min":m<60?m+" min":Math.floor(m/60)+"h "+pad(m%60)+"m"};
const hhmm=ms=>new Date(ms).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
const el=id=>{const x=S[id];if(!x||!x.at||x.s==="na")return 0;return (x.dt||Date.now())-x.at};
const xOf=id=>(S[id]&&S[id].x)||0;const tatOf=id=>(TATS[id-1]||30)+xOf(id);
const isSlow=id=>el(id)>tatOf(id)*60000;
function tmHtml(id){if(DAYS[id]&&lock(id))return`<span class="tm">Available Sundays &amp; Wednesdays only</span>`;const x=S[id];if(!x||!x.at||x.s==="na")return"";const d=x.s==="done";
 return `<span class="tm ${isSlow(id)?"slow":""}">Assigned ${hhmm(x.at)} · expected by ${hhmm(x.at+tatOf(id)*60000)} · ${d?"finished "+hhmm(x.dt)+" · took ":"in progress "}${fmt(el(id))}${isSlow(id)?" ⚠ LATE (TAT "+tatOf(id)+" min)":""}</span>`}
function report(){
 rep.className=repOpen?"open":"";if(!repOpen)return;
 const rows=tasks.filter(t=>S[t.id]&&S[t.id].at&&V(t.id)!=="na").map(t=>({t,x:S[t.id],d:el(t.id)})).sort((a,b)=>b.d-a.d);
 const g={};H.forEach(r=>{(g[r.id]=g[r.id]||[]).push(r)});
 const avg=Object.keys(g).map(k=>{const l=g[k];return{t:tasks.find(t=>t.id==k),n:l.length,a:l.reduce((s,r)=>s+r.dur,0)/l.length,m:Math.max(...l.map(r=>r.dur))}}).filter(r=>r.t).sort((a,b)=>b.a-a.a).slice(0,15);
 const red=(v,id)=>v>tatOf(id)*60000?' style="color:#dc2626;font-weight:600"':"";
 rep.innerHTML=`<div class="box"><div class="sc"><h3>Today (longest first)</h3><table><tr><th>Task</th><th>Teller</th><th>Assigned</th><th>Expected by</th><th>Finished</th><th>TAT</th><th>Time</th></tr>${rows.map(r=>`<tr><td>${esc(r.t.t)}</td><td>${esc(nm(r.x.a))}</td><td>${hhmm(r.x.at)}</td><td>${hhmm(r.x.at+tatOf(r.t.id)*60000)}</td><td>${r.x.dt?hhmm(r.x.dt):"in progress"}</td><td>${tatOf(r.t.id)} min</td><td${red(r.d,r.t.id)}>${fmt(r.d)}</td></tr>`).join("")||'<tr><td colspan="7">Nothing assigned yet today.</td></tr>'}</table></div>
 <div class="sc"><h3>Slowest tasks across all days (average)</h3><table><tr><th>Task</th><th>Times done</th><th>TAT</th><th>Average</th><th>Longest</th></tr>${avg.map(r=>`<tr><td>${esc(r.t.t)}</td><td>${r.n}</td><td>${tatOf(r.t.id)} min</td><td${red(r.a,r.t.id)}>${fmt(r.a)}</td><td${red(r.m,r.t.id)}>${fmt(r.m)}</td></tr>`).join("")||'<tr><td colspan="5">No finished tasks recorded yet.</td></tr>'}</table></div></div>`;
}
const remOf=id=>{if(V(id))return 0;const m=tatOf(id)*60000;return A(id)?Math.max(m-el(id),0):m};
const fz=ms=>ms>0?fmt(ms):"0";
function stats(){
 let d=0,na=0;tasks.forEach(t=>{const v=V(t.id);if(v==="done")d++;else if(v==="na")na++});
 const T=tasks.length;
 date.textContent=new Date().toLocaleDateString(undefined,{weekday:"long",year:"numeric",month:"long",day:"numeric"})+" · resets daily · "+(mode==="live"?"shared live":mode==="local"?"not shared: open the Claude link while signed in":mode==="error"?"connection problem":"connecting…");
 sDone.textContent="Done "+d;sNa.textContent="N/A "+na;sPend.textContent="Pending "+(T-d-na)+" / "+T;
 let rem=0;tasks.forEach(t=>{if(!V(t.id)){const m=tatOf(t.id)*60000;rem+=A(t.id)?Math.max(m-el(t.id),0):m}});
 sLeft.textContent="⏳ "+fz(rem);sF4.textContent="👥 "+(rem?hhmm(Date.now()+rem/4):"—");sF1.textContent="👤 "+(rem?hhmm(Date.now()+rem):"—");
 b1.style.width=d/T*100+"%";b2.style.width=na/T*100+"%";
 let h="";for(let k=1;k<=4;k++){const mine=tasks.filter(t=>A(t.id)===k&&V(t.id)!=="na"),dn=mine.filter(t=>V(t.id)==="done").length;h+=`<span class="chip">${NAMES[k-1]}: ${dn}/${mine.length} done</span>`}
 const un=tasks.filter(t=>!A(t.id)&&!V(t.id)).length;h+=`<span class="chip">Unassigned: ${un}</span>`;const sl=tasks.filter(t=>isSlow(t.id)).length;h+=`<span class="chip late">Late: ${sl}</span>`;tellers.innerHTML=h;
}
function render(){
 const cats=[...new Set(tasks.map(t=>t.c))];let h="",shown=0;
 cats.forEach(c=>{const list=tasks.filter(t=>t.c===c),na=list.filter(t=>V(t.id)==="na").length,dn=list.filter(t=>V(t.id)==="done").length;
  h+=`<section class="cat"><h2>${esc(c)}<div class="hr"><span class="ct" title="Total TAT · work left">⏱ ${fz(list.reduce((s,t)=>s+(V(t.id)==="na"?0:tatOf(t.id)*60000),0))} · ⏳ ${fz(list.reduce((s,t)=>s+remOf(t.id),0))}</span><span>${dn}/${list.length-na} done${na?" · "+na+" N/A":""}</span></div></h2>`;
  list.forEach(t=>{const v=V(t.id),a=A(t.id);
   const ok=(filter==="all"||(filter==="pending"?!v:v===filter))&&(tfil==="all"||a===+tfil)&&(!query||t.t.toLowerCase().includes(query));
   if(ok)shown++;
   h+=`<div class="t ${v} ${ok?"":"hide"} ${isSlow(t.id)?"slow":""}" data-id="${t.id}"><div class="ck" data-a="done" title="Mark done">${v==="done"?"✓":v==="na"?"–":""}</div>
   <div class="tt"><div class="nm">${esc(t.t)}</div><div class="mt"><span class="tp">⏱ ${tatOf(t.id)} min${xOf(t.id)?` (+${xOf(t.id)})`:""}</span>${v?"":`<button class="px" data-a="plus" title="Add 2 min to this task today">+2</button>${xOf(t.id)?`<button class="px" data-a="minus" title="Remove 2 min">−2</button>`:""}`}<button class="nb" data-a="na" ${lock(t.id)?"disabled":""}>${lock(t.id)?"Not today":v==="na"?"Undo N/A":"N/A"}</button></div>${tmHtml(t.id)}</div>
   <select data-a="assign" class="${a?"has":""}" ${v==="na"?"disabled":""}><option value="0">Assign…</option>${[1,2,3,4].map(k=>`<option value="${k}" ${a===k?"selected":""}>${NAMES[k-1]}</option>`).join("")}</select></div>`});
  h+="</section>"});
 if(!shown)h+='<div class="empty">No tasks match this filter.</div>';
 main.innerHTML=h;stats();report();
}
main.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b||b.tagName==="SELECT"||b.tagName==="INPUT")return;checkDay();
 const id=+b.closest(".t").dataset.id,a=b.dataset.a;if(lock(id))return;
 if(a==="done")put(id,{s:V(id)==="done"?"":"done"});
 else if(a==="na")put(id,{s:V(id)==="na"?"":"na"});
 else if(a==="plus")put(id,{x:xOf(id)+2});
 else if(a==="minus")put(id,{x:Math.max(xOf(id)-2,0)});
});
main.addEventListener("change",e=>{if(e.target.dataset.a==="assign"){checkDay();put(+e.target.closest(".t").dataset.id,{a:+e.target.value})}});
document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{filter=b.dataset.f;document.querySelectorAll("[data-f]").forEach(x=>x.classList.toggle("on",x===b));render()});
q.oninput=()=>{query=q.value.toLowerCase();render()};
tf.onchange=()=>{tfil=tf.value;render()};
rb.onclick=()=>{repOpen=!repOpen;rb.classList.toggle("on",repOpen);render()};
reset.onclick=()=>{if(!confirm("Clear today’s assignments and progress for everyone?"))return;
 const ids=Object.keys(S);S={};render();
 if(!db){saveLocal();return}
 ids.forEach(id=>{queue[id]=(queue[id]||Promise.resolve()).then(()=>Promise.all([db.collection("days/"+day+"/tasks").doc(id).delete(),db.collection("history").doc(day+"-"+id).delete()])).catch(()=>{})})};
document.addEventListener("visibilitychange",()=>{if(!document.hidden)checkDay()});
setInterval(()=>{checkDay();if(!["SELECT"].includes(document.activeElement.tagName))render()},30000);
document.getElementById("tf").insertAdjacentHTML("beforeend",NAMES.map((n,i)=>`<option value="${i+1}">${n}</option>`).join(""));
init();
</script></body></html>
